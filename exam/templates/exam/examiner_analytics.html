<!DOCTYPE html>
<html>
<head>
    <title>CBOES</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            min-height: 86vh;
        }

        .container {
            max-width: 900px;
            margin: 100px auto;
            background: #fff;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        h2 {
            color: #1d2671;
            margin-top: 0;
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            background: #1d2671;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }

        .title-banner{
            position:absolute;
            top:30px;
            width:100%;
            text-align:center;
            font-family:'Orbitron', sans-serif;
        }

        .title-banner span{
            display:inline-block;
            font-size:20px;
            font-weight:700;
            letter-spacing:2px;
            opacity:0;
        }

        /* EXAMSPHERE */

        .title-exam{
            background: linear-gradient(45deg,#ffffff,#9be7ff);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            animation: slideLeft 1.2s ease forwards;
        }

        /* SMARTEXAM */

        .title-smart{
            background: linear-gradient(45deg,#ffd700,#ff9800);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            margin:0 8px;
            animation: slideTop 1.2s ease forwards;
        }

        /* CLOUD SYSTEM */

        .title-cloud{
            background: linear-gradient(45deg,#00e5ff,#00bcd4);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            animation: slideRight 1.2s ease forwards;
        }

        /* UNDERLINE */

        .title-underline{
            width:0;
            height:4px;
            margin:12px auto;
            background:linear-gradient(90deg,#00e5ff,#c33764,#ffd700);
            border-radius:10px;
            animation: underlineGrow 1.6s ease forwards;
        }

        /* ANIMATIONS */

        @keyframes slideLeft{
            from{
                transform:translateX(-500px);
                opacity:0;
            }
            to{
                transform:translateX(0);
                opacity:1;
            }
        }

        @keyframes slideRight{
            from{
                transform:translateX(500px);
                opacity:0;
            }
            to{
                transform:translateX(0);
                opacity:1;
            }
        }

        @keyframes slideTop{
            from{
                transform:translateY(-200px);
                opacity:0;
            }
            to{
                transform:translateY(0);
                opacity:1;
            }
        }

        @keyframes underlineGrow{
            from{
                width:0;
                opacity:0;
            }
            to{
                width:420px;
                opacity:1;
            }
        }
    </style>
</head>
<body>
<div class="title-banner">
    <span class="title-exam">
        CloudBased
    </span>
    <span class="title-smart">
       - Online Examination -
    </span>
    <span class="title-cloud">
        System
    </span>
    <div class="title-underline"></div>
</div>
<div class="container">
    <h2>Exam-wise Average Score</h2>
    <canvas id="analyticsChart"></canvas>
    <a href="{% url 'examiner_dashboard' %}" class="back-btn">
        Back to Dashboard
    </a>
</div>
{{ labels|json_script:"labels-data" }}
{{ data|json_script:"scores-data" }}

<script>
    const labels = JSON.parse(
        document.getElementById("labels-data").textContent
    );

    const scores = JSON.parse(
        document.getElementById("scores-data").textContent
    );

    const ctx = document.getElementById("analyticsChart").getContext("2d");

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Average Score",
                data: scores,
                backgroundColor: "#c33764"
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>

</body>
</html>
