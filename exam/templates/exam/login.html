{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>CBOES</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body{
            margin:0;
            font-family:"Segoe UI",Tahoma,sans-serif;
            background:linear-gradient(135deg,#1d2671,#c33764);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .container {
            width: 350px;
            margin: 100px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button {
            padding: 10px;
            margin-top: 10px;
        }
        input {
            width: 330px;
            border: 1px solid #2f2b2b;
            border-radius: 4px;
        }
        button {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .register-link {
            text-align: center;
            margin-top: 15px;
        }
        .register-link a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        .password-box {
            position: relative;
        }
        .eye {
            position: absolute;
            right: 10px;
            top: 58%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
        }
        .title-banner{
            position:absolute;
            top:60px;
            width:100%;
            text-align:center;
            font-family:'Orbitron', sans-serif;
        }

        .title-banner span{
            display:inline-block;
            font-size:42px;
            font-weight:700;
            letter-spacing:2px;
            opacity:0;
        }

        /* EXAMSPHERE */

        .title-exam{
            background: linear-gradient(45deg,#ffffff,#9be7ff);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            animation: slideLeft 1.2s ease forwards;
        }

        /* SMARTEXAM */

        .title-smart{
            background: linear-gradient(45deg,#ffd700,#ff9800);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            margin:0 8px;
            animation: slideTop 1.2s ease forwards;
        }

        /* CLOUD SYSTEM */

        .title-cloud{
            background: linear-gradient(45deg,#00e5ff,#00bcd4);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            animation: slideRight 1.2s ease forwards;
        }

        /* UNDERLINE */

        .title-underline{
            width:0;
            height:4px;
            margin:12px auto;
            background:linear-gradient(90deg,#00e5ff,#c33764,#ffd700);
            border-radius:10px;
            animation: underlineGrow 1.6s ease forwards;
        }

        /* ANIMATIONS */

        @keyframes slideLeft{
            from{
                transform:translateX(-500px);
                opacity:0;
            }
            to{
                transform:translateX(0);
                opacity:1;
            }
        }

        @keyframes slideRight{
            from{
                transform:translateX(500px);
                opacity:0;
            }
            to{
                transform:translateX(0);
                opacity:1;
            }
        }

        @keyframes slideTop{
            from{
                transform:translateY(-200px);
                opacity:0;
            }
            to{
                transform:translateY(0);
                opacity:1;
            }
        }

        @keyframes underlineGrow{
            from{
                width:0;
                opacity:0;
            }
            to{
                width:800px;
                opacity:1;
            }
        }
    </style>
</head>
<body>
<div class="title-banner">
    <span class="title-exam">
        CloudBased
    </span>
    <span class="title-smart">
       - Online Examination -
    </span>
    <span class="title-cloud">
        System
    </span>
    <div class="title-underline"></div>
</div>
<div class="container">
    <h2 style="text-align:center;">Login</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>

        <div class="password-box">
            <input type="password" name="password" id="loginPassword" placeholder="Password" required>
            <span class="eye" onclick="toggleLoginPassword()" id="loginEye">🫣</span>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="register-link">
        <p>New user?</p>
        <a href="{% url 'signup' %}">Register here</a>
    </div>
</div>

<script>
    function toggleLoginPassword() {
        const pwd = document.getElementById("loginPassword");
        const eye = document.getElementById("loginEye");

        if (pwd.type === "password") {
            pwd.type = "text";
            eye.textContent = "👀";
        } else {
            pwd.type = "password";
            eye.textContent = "🫣";
        }
    }
</script>

</body>
</html>
